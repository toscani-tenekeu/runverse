server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Workspaces up to MAX_WORKSPACE_MB (100 MB by default) travel in run and share requests.
    client_max_body_size 200m;

    # Trust X-Forwarded-For only from a reverse proxy on a private network, so rate limits key on the real visitor.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No landing page in a self-hosted install: the editor is the whole site.
    location = / {
        absolute_redirect off;
        return 302 /editor;
    }

    location / {
        try_files $uri =404;
    }

    # Built editor assets have hashed names, so they can be cached for good.
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Editor routes are handled by the React app.
    location ~ ^/(editor|s)(/|$) {
        add_header Cache-Control "no-cache";
        try_files /app/index.html =404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
