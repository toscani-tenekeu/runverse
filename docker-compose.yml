name: runverse

services:
  piston:
    # Piston's own image with a bigger request limit (it stops at 100 KB), so larger workspaces can run.
    build: ./piston
    image: runverse-piston
    privileged: true # required by Piston's isolate sandbox
    restart: unless-stopped
    # Caps for the whole runner, so a traffic spike can't starve the rest of the machine.
    mem_limit: ${PISTON_MEMORY:-3g}
    cpus: ${PISTON_CPUS:-2}
    environment:
      PISTON_RUN_TIMEOUT: ${RUN_TIMEOUT_MS:-3000}
      PISTON_COMPILE_TIMEOUT: ${COMPILE_TIMEOUT_MS:-10000}
      PISTON_OUTPUT_MAX_SIZE: 65536
      PISTON_MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_RUNS:-4} # extra runs wait in a queue
      PISTON_RUN_MEMORY_LIMIT: ${MEMORY_LIMIT_BYTES:-536870912}
      PISTON_COMPILE_MEMORY_LIMIT: -1
      # JVM, BEAM and Zig start slowly and use several threads, so they get more time.
      PISTON_LIMIT_OVERRIDES: >-
        {"java":{"run_timeout":8000,"run_cpu_time":15000,"compile_timeout":30000,"compile_cpu_time":60000},
        "csharp":{"run_timeout":8000,"run_cpu_time":15000,"compile_timeout":30000,"compile_cpu_time":60000},
        "go":{"compile_timeout":30000,"compile_cpu_time":60000,"max_file_size":64000000},
        "kotlin":{"run_timeout":8000,"run_cpu_time":15000,"compile_timeout":30000,"compile_cpu_time":60000},
        "scala":{"run_timeout":8000,"run_cpu_time":15000,"compile_timeout":30000,"compile_cpu_time":60000},
        "clojure":{"run_timeout":8000,"run_cpu_time":15000},
        "elixir":{"run_timeout":8000,"run_cpu_time":15000},
        "zig":{"run_timeout":8000,"run_cpu_time":15000,"compile_timeout":30000,"compile_cpu_time":60000}}
    volumes:
      - piston_packages:/piston
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
    networks: [internal]

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      piston:
        condition: service_healthy
    environment:
      PISTON_URL: http://piston:2000
      DATA_DIR: /data
      RUNVERSE_AUTH: ${RUNVERSE_AUTH:-true} # false: open to anyone who can reach the site
      RUNS_PER_MINUTE: ${RUNS_PER_MINUTE:-30}
      SHARES_PER_HOUR: ${SHARES_PER_HOUR:-20}
      MAX_WORKSPACE_MB: ${MAX_WORKSPACE_MB:-100} # biggest workspace a run or share link can carry
    volumes:
      - runverse_data:/data
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        LANDING: ${RUNVERSE_LANDING:-false} # true also serves the landing page
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${RUNVERSE_BIND:-0.0.0.0}:${RUNVERSE_PORT:-8085}:80"
    networks: [internal]

  # Builds the custom language packages (.NET, Java 21, Go, Node 22, C++20).
  # Only runs on demand: ./scripts/languages.sh calls `docker compose run --rm packages …`.
  packages:
    image: alpine:3.20
    profiles: [tools]
    entrypoint: ["/bin/sh", "/build/install.sh"]
    volumes:
      - piston_packages:/piston
      - ./piston-packages:/build:ro
    networks: [internal]

volumes:
  piston_packages:
  runverse_data:

networks:
  internal:
